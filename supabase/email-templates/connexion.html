<!-- Supabase > Authentication > Emails > « Magic link »
     Sujet conseillé : Votre lien de connexion Aspyre Studio -->
<div style="font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; max-width: 520px; margin: 0 auto; padding: 32px 24px; color: #1d1b2f;">
  <p style="font-size: 20px; font-weight: 700; margin: 0 0 24px;">Aspyre <span style="font-weight: 400; color: #6b6880;">Studio</span></p>
  <h1 style="font-size: 24px; margin: 0 0 12px;">Votre lien de connexion</h1>
  <p style="line-height: 1.6; color: #4a475e;">Cliquez ci-dessous pour retrouver votre espace client et votre brief.</p>
  <p style="margin: 32px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/espace"
       style="background: #5b3df5; color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 999px; font-weight: 600; display: inline-block;">
      Me connecter
    </a>
  </p>
  <p style="font-size: 13px; color: #6b6880;">Vous n'avez pas demandé ce lien ? Ignorez simplement cet e-mail.</p>
</div>
